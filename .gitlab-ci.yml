# GitLab CI/CD
#
# **GitLab 11.3.4（2018年9月）で動作すること**を条件にしている。
# そのため以下は使っていない。使うとパイプラインが作成されない。
#
#   rules:               12.3で追加。代わりに only / when を使う
#   needs:               12.2で追加
#   workflow:            12.5で追加
#   include:             Coreで使えるのは11.4以降
#   only: changes:       11.4で追加
#   parallel:            11.5で追加
#   retry: の詳細指定     11.5で追加（整数指定のみ可）
#   extends:             11.3で追加されたばかりのため、YAMLアンカーを使う
#   !reference           13.xで追加
#
# 実行に必要なRunner
#   Linuxの3ジョブ  タグ指定なし。gitlab.com の共有Runnerで動く
#   ios:build       Xcodeが入ったmacOSのshell executor（タグ macos）
#
# **タグを指定するとそのタグを持つRunnerしか拾わない。** 共有Runnerは
# docker というタグを持たないため、Linux側にタグを付けると
# 「This job is stuck because you don't have any active runners」で止まる。

stages:
  - analyze
  - test
  - build

variables:
  GIT_DEPTH: "10"
  # cache:paths はプロジェクトディレクトリの外を指定できないため、
  # pubとGradleのキャッシュ先をプロジェクト配下へ移す。
  PUB_CACHE: "$CI_PROJECT_DIR/.cache/pub"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.cache/gradle"
  # ジョブごとにコンテナが使い捨てられるため、デーモンは常駐させない。
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# ---------------------------------------------------------------------------
# 共通定義
#
# アンカーはマージキー（<<:）で取り込む。listのアンカーをlistの要素として
# 展開する書き方は古いGitLabでは平坦化されないため使わない。
# ---------------------------------------------------------------------------

# ベースイメージ。Android SDK・JDK・ライセンス同意が入っているものを使う。
#
# **このイメージが持つFlutterは使わない。** 配布されている最新が3.44.0で、
# pubspec.yaml の sdk: ^3.13.1 を満たさないため pub get が失敗する。
# Flutter本体は下の .flutter_install で公式アーカイブから入れる。
# イメージ側が追いついたら、この上書きは不要になる。
.flutter_docker: &flutter_docker
  image: ghcr.io/cirruslabs/flutter:3.44.0

# Flutter SDKの導入。scriptの1要素として展開されるスカラーのアンカー。
# （!reference は13.x、extends は11.3で追加されたばかりのため使わない）
.flutter_install: &flutter_install |
  set -e
  # バージョンの唯一の情報源は .flutter-version。
  # 11.3では variables: に動的な値を書けないため、ここで解決する。
  FLUTTER_VERSION=$(tr -d '[:space:]' < .flutter-version)
  if [ -z "$FLUTTER_VERSION" ]; then
    echo "error: .flutter-version からバージョンを読めなかった"
    exit 1
  fi
  echo "Flutter ${FLUTTER_VERSION} (.flutter-version)"
  FLUTTER_SDK="/opt/flutter-${FLUTTER_VERSION}"
  if [ ! -x "$FLUTTER_SDK/bin/flutter" ]; then
    mkdir -p "$FLUTTER_SDK"
    curl -fsSL -o /tmp/flutter.tar.xz \
      "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
    tar -xJf /tmp/flutter.tar.xz -C "$FLUTTER_SDK" --strip-components=1
  fi
  export PATH="$FLUTTER_SDK/bin:$PATH"
  # SDKの所有者とジョブの実行ユーザーが異なると、gitが dubious ownership で
  # SDKのバージョン判定に失敗する。
  git config --global --add safe.directory '*'
  flutter --version

.dart_cache: &dart_cache
  key: "dart-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pub

.android_cache: &android_cache
  key: "android-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pub
    - .cache/gradle/caches
    - .cache/gradle/wrapper

# ---------------------------------------------------------------------------
# Flutterモジュール
#
# ネイティブへ組み込まずに検証できる（ガイド0.5節）。チャネル越しの依存は
# fakeへ差し替わるため、実機もネットワークも要らない。
# ---------------------------------------------------------------------------

flutter:analyze:
  <<: *flutter_docker
  stage: analyze
  cache: *dart_cache
  before_script:
    - *flutter_install
    # pub getでl10nのコードも生成される（pubspec.yaml の generate: true）。
    # 生成物はコミット済みだが、ARBだけ更新された場合にここで差分が出る。
    - cd legacyapp_flutter
    - flutter pub get
  script:
    - flutter analyze

flutter:test:
  <<: *flutter_docker
  stage: test
  cache: *dart_cache
  before_script:
    - *flutter_install
    - cd legacyapp_flutter
    - flutter pub get
  script:
    - flutter test

# ---------------------------------------------------------------------------
# Android（source module 方式）
# ---------------------------------------------------------------------------

android:build:
  <<: *flutter_docker
  stage: build
  cache: *android_cache
  before_script:
    - *flutter_install
    # Android SDKの場所。イメージが環境変数で持っている。
    - test -n "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" || (echo "Android SDK not found in the image" && exit 1)
    # local.properties は絶対パスを含むマシン固有の設定のため、
    # リポジトリには含まれない。無いと SDK location not found で失敗する。
    - echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > legacy_android/local.properties
    # settings.gradle が参照する .android/include_flutter.groovy を生成する。
    # source module 方式ではこれが無いとGradleの構成解決に失敗する。
    - cd legacyapp_flutter
    - flutter pub get
    - cd ..
  script:
    - cd legacy_android
    - ./gradlew --no-daemon assembleDebug
  # APKは artifacts にしない。Flutterを含むDebug APKは1GBを超えるため、
  # 保存するとジョブの大半がアップロード時間になる。

# ---------------------------------------------------------------------------
# iOS（SPM 方式）
#
# Xcodeが必要なためmacOSのRunnerでしか動かない。Runnerが用意されていない環境で
# パイプラインが滞留しないよう、手動実行にしてある。常時実行にする場合は
# when / allow_failure を消す。
#
# Runnerに必要なもの: Xcode 15以上、xcodegen、Flutter SDK
# ---------------------------------------------------------------------------

ios:build:
  stage: build
  tags:
    - macos
  when: manual
  allow_failure: true
  before_script:
    - flutter --version
    - cd legacyapp_flutter
    - flutter pub get
    - cd ..
  script:
    # ガイド4.3節の順序。プロジェクト定義 → 生成物 → ビルド。
    - cd legacy_ios
    - xcodegen generate
    - cd ../legacyapp_flutter
    # 出力先 legacyapp_flutter/build/ はバージョン管理外のため毎回生成する。
    # Androidの .android/ が pub get で作られるのとは異なり、専用のコマンドが要る。
    - flutter build swift-package --platform ios
    - cd ../legacy_ios
    - xcodebuild
        -project LegacyApp.xcodeproj
        -scheme LegacyApp
        -sdk iphonesimulator
        -configuration Debug
        -destination "generic/platform=iOS Simulator"
        CODE_SIGNING_ALLOWED=NO
        build
