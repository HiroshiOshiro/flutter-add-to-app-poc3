apply plugin: 'com.android.application'

android {
    namespace 'com.example.legacyapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.legacyapp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // ABIを絞る（手順3.4節）。既定では絞らない。
        //
        // **DebugのFlutterライブラリはABIごとに300〜600MBある。** 全ABIだと
        // APKが1.4GBを超え、ディスクの限られたCIでは `No space left on device`
        // でパッケージングに失敗する。
        //
        //   ./gradlew assembleDebug -PtargetAbi=x86_64
        if (project.hasProperty('targetAbi')) {
            ndk {
                abiFilters project.property('targetAbi')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // source module として取り込んだFlutterモジュール
    implementation(project(":flutter"))
}
